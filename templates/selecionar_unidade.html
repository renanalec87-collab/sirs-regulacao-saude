<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selecionar Unidade - Intranet CAPS</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .card-unidade {
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            border: 1px solid #dee2e6;
        }
        .card-unidade:hover {
            border-color: #0d6efd;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.05);
            background-color: #fdfdfe;
        }
        .card-unidade input[type="radio"]:checked ~ .card-body {
            background-color: #f0f7ff;
        }
    </style>
</head>
<body>

    <!-- Barra Superior gov.br / Sistema -->
    <nav class="navbar navbar-dark bg-dark px-4 py-2">
        <span class="navbar-brand mb-0 h6">gov.br</span>
        <span class="text-light small">Intranet CAPS - São Roque</span>
    </nav>

    <div class="container mt-5" style="max-width: 700px;">
        
        <!-- Mensagens Flash -->
        with get_flashed_messages(with_categories=true) as messages:
            if messages:
                for category, message in messages:
                    <div class="alert alert-{{ 'danger' if category == 'danger' else 'success' }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                endif
            endif
        endwith

        <h3 class="fw-bold mb-1">Bem-vindo, {{ nome_profissional }}</h3>
        <p class="text-muted mb-4">Escolha um acesso para continuar</p>

        <form method="POST">
            {% for v in vinculos %}
            <div class="card card-unidade mb-3 rounded-3 shadow-sm">
                <div class="card-body p-3">
                    <div class="form-check d-flex align-items-center">
                        <input class="form-check-input me-3 mt-0" type="radio" name="vinculo_id" value="{{ v.vinculo_id }}" id="vinculo_{{ v.vinculo_id }}" required style="transform: scale(1.2);">
                        <label class="form-check-label w-100 cursor-pointer" for="vinculo_{{ v.vinculo_id }}">
                            <div class="d-flex align-items-center mb-1">
                                <span class="text-primary me-2">📍</span>
                                <strong class="text-dark fs-6">{{ v.estabelecimento_nome }}</strong>
                            </div>
                            <div class="text-secondary small ps-4">
                                <strong>CBO</strong> {{ v.cbo_ocupacao }} - {{ v.cbo_codigo }}
                            </div>
                        </label>
                    </div>
                </div>
            </div>
            {% endfor %}

            <hr class="my-4 text-muted">

            <div class="d-flex justify-content-end">
                <a href="{{ url_for('logout') }}" class="btn btn-outline-secondary px-4">Sair</a>
            </div>
        </form>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Torna o card inteiro clicável para selecionar o radio button
        document.querySelectorAll('.card-unidade').forEach(card => {
            card.addEventListener('click', function(e) {
                const radio = this.querySelector('input[type="radio"]');
                if (radio) {
                    radio.checked = true;
                    // Submete o formulário automaticamente ao clicar no card (opcional, ou deixa o usuário clicar no card e envia)
                    document.querySelector('form').submit();
                }
            });
        });
    </script>
</body>
</html>
